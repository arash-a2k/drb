name: Validate

on:
  pull_request:
  push:
    branches:
      - main
      - master
      - feat/**

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm

      - name: Install dependencies
        run: npm ci --legacy-peer-deps

      - name: Validate content drafts
        run: npm run validate:content

      - name: Check page generator sample
        run: npm run create:page -- --draft packages/content-automation/schemas/examples/pageDraft.sample.json --dry-run

      - name: Export static site
        run: npm run pre-deploy
